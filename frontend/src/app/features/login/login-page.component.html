<main class="login">
  <mat-card class="login__card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Cotizador de seguros</mat-card-title>
      <mat-card-subtitle>Ingresá con tu cuenta de productor</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="login__form" [formRoot]="loginForm">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" autocomplete="username" [formField]="loginForm.email" />
          @if (loginForm.email().errors().length) {
            <mat-error>{{ loginForm.email().errors()[0].message }}</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            type="password"
            autocomplete="current-password"
            [formField]="loginForm.password"
          />
          @if (loginForm.password().errors().length) {
            <mat-error>{{ loginForm.password().errors()[0].message }}</mat-error>
          }
        </mat-form-field>

        <button
          matButton="filled"
          type="submit"
          [disabled]="loginForm().invalid() || loginForm().submitting()"
        >
          Ingresar
        </button>

        @if (loginError()) {
          <p class="login__error" role="alert">{{ loginError() }}</p>
        }
      </form>
    </mat-card-content>
  </mat-card>
</main>
